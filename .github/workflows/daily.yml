name: Daily update
on:
  schedule:
    - cron: "30 21 * * 1-5"   # 21:30 UTC weekdays = after the US close in both EST and EDT
  workflow_dispatch: {}
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: daily
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - name: Restore price-history cache
        uses: actions/cache@v4
        with:
          path: data/hist
          key: hist-${{ github.run_id }}
          restore-keys: hist-
      - run: pip install yfinance
      - name: Run engine
        env:
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}   # e.g. "CrashMonitor you@example.com"
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}   # optional: adds an AI-written summary paragraph
        run: python engine/run_daily.py
      - name: Save data back to the repo
        run: |
          git config user.name "crash-monitor-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/latest.json data/history.json data/markets.json data/brief.json data/calendar.json data/outlook.json data/quotes.json data/earnings.json data/sectors.json data/search.json data/gics.json data/cache/form4_*.json
          git commit -m "Daily update $(date -u +%F)" || echo "no changes"
          for i in 1 2 3; do
            git pull --rebase -X theirs origin main && git push && break
            sleep 5
          done
      - name: Assemble site
        run: |
          mkdir -p site/data
          cp -R web/. site/
          B=$(date -u +%Y%m%d%H%M%S)
          sed -i "s/__BUILD__/$B/g" site/index.html
          echo "{\"v\":\"$B\"}" > site/version.json
          mkdir -p site/data/hist site/data/sparks && cp data/hist/*.json site/data/hist/ && cp data/sparks/*.json site/data/sparks/
          cp data/latest.json data/history.json data/markets.json data/brief.json data/calendar.json data/outlook.json data/quotes.json data/earnings.json data/sectors.json data/search.json data/gics.json site/data/
      - uses: actions/upload-pages-artifact@v3
        with: { path: site }
      - id: deploy
        uses: actions/deploy-pages@v4
