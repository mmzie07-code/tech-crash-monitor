name: Daily update
on:
  schedule:
    - cron: "30 21 * * 1-5"   # 21:30 UTC weekdays = after the US close in both EST and EDT
    - cron: "45 12 * * 1-5"   # 12:45 UTC weekdays = before the open: fills in after-close earnings results and moves the calendar to today
  workflow_dispatch:
    inputs:
      mode:
        description: "Leave empty for the full update, or type morning for the quick earnings/calendar refresh"
        required: false
        default: ""
      snap_limit:
        description: "Company snapshots to refresh (default 200; use 600 to refresh all)"
        required: false
        default: "200"
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: daily
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - name: Restore price-history cache
        uses: actions/cache@v4
        with:
          path: |
            data/hist
            data/hist-ohlc
            data/snap
          key: hist-${{ github.run_id }}
          restore-keys: hist-
      # A cache is identified by its list of folders, so this one stays separate from the cache above (adding a folder there silently discards everything saved)
      - name: Restore company-descriptions cache
        uses: actions/cache@v4
        with:
          path: data/about
          key: about-${{ github.run_id }}
          restore-keys: about-
      - run: pip install yfinance
      - name: Run engine
        env:
          SNAP_LIMIT: ${{ github.event.inputs.snap_limit || '200' }}
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}   # e.g. "CrashMonitor you@example.com"
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}   # optional: adds an AI-written summary paragraph
        run: python engine/run_daily.py ${{ github.event.inputs.mode || (github.event.schedule == '45 12 * * 1-5' && 'morning' || '') }}
      - name: Save data back to the repo
        run: |
          git config user.name "crash-monitor-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/latest.json data/history.json data/markets.json data/brief.json data/calendar.json data/recaps.json data/event_archive.json data/outlook.json data/quotes.json data/fundamentals.json data/balance.json data/earnings.json data/sectors.json data/search.json data/ipos.json data/housing.json data/crypto.json data/currencies.json data/dollar100.json data/overlooked.json data/gics.json data/fx/*.json data/cache/form4_*.json
          git commit -m "Daily update $(date -u +%F)" || echo "no changes"
          for i in 1 2 3; do
            git pull --rebase -X theirs origin main && git push && break
            sleep 5
          done
      - name: Assemble site
        run: bash scripts/assemble_site.sh
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      - uses: actions/upload-pages-artifact@v3
        with: { path: site }
      - id: deploy
        uses: actions/deploy-pages@v4
