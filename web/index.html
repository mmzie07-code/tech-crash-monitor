<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Tech Crash Monitor</title>
<style>
:root{--bg:#0f1115;--card:#181b22;--tx:#e8eaf0;--mut:#8b93a5;--ok:#3ecf8e;--warn:#f5a524;--bad:#f0616d;--unk:#4a5164}
@media(prefers-color-scheme:light){:root{--bg:#f5f6f8;--card:#fff;--tx:#14171f;--mut:#5d6579;--unk:#b5bccb}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.45 -apple-system,system-ui,sans-serif}
main{max-width:860px;margin:0 auto;padding:20px 16px 60px}h1{font-size:20px;margin:0 0 2px}.sub{color:var(--mut);font-size:13px}
.card{background:var(--card);border-radius:14px;padding:18px;margin-top:14px}
.hero{display:flex;gap:24px;align-items:center;flex-wrap:wrap}.big{font-size:64px;font-weight:700;line-height:1}
.lvl{font-size:18px;font-weight:600}.pair{display:flex;gap:20px;margin-top:8px;color:var(--mut)}.pair b{color:var(--tx)}
.item{display:flex;gap:12px;padding:12px 0;border-top:1px solid rgba(128,128,128,.18)}.item:first-child{border-top:0}
.dot{flex:none;width:12px;height:12px;border-radius:50%;margin-top:5px}.n{font-weight:600}.d{color:var(--mut);font-size:13px}
.tag{font-size:11px;color:var(--mut);border:1px solid rgba(128,128,128,.4);border-radius:6px;padding:0 5px;margin-left:6px}
h2{font-size:14px;margin:0 0 6px;color:var(--mut);text-transform:uppercase;letter-spacing:.06em}
svg{width:100%;height:110px}.foot{color:var(--mut);font-size:12px;margin-top:18px}
</style></head><body><main>
<h1>Tech Crash Monitor</h1><div class="sub" id="sub">Loading…</div>
<div class="card hero"><div><div class="big" id="score">–</div><div class="sub">warnings flashing (0–100)</div></div>
<div><div class="lvl" id="lvl"></div><div class="pair"><span>Stretch <b id="st"></b></span><span>Trigger <b id="tr"></b></span></div>
<div class="sub" id="cov" style="margin-top:6px"></div></div></div>
<div class="card"><h2>QQQ, 1 year</h2><svg id="ch" viewBox="0 0 600 110" preserveAspectRatio="none"></svg></div>
<div class="card"><h2>Checklist</h2><div id="list"></div></div>
<div class="foot" id="disc"></div></main>
<script>
const col={warn:'var(--warn)',ok:'var(--ok)',unknown:'var(--unk)'};
fetch('../data/latest.json?'+Date.now()).then(r=>r.json()).then(d=>{
 sub.textContent=`As of ${d.date} close · QQQ ${d.qqq_last}`;score.textContent=d.score;lvl.textContent=d.level+' risk';
 lvl.style.color=({Low:'var(--ok)',Elevated:'var(--warn)',High:'var(--bad)',Severe:'var(--bad)'})[d.level];
 st.textContent=d.stretch??'–';tr.textContent=d.trigger??'–';
 cov.textContent=`${d.evaluated} of ${d.total} checks live; the rest need data sources not yet connected.`;
 list.innerHTML=d.checks.map(c=>`<div class="item"><div class="dot" style="background:${col[c.status]}"></div><div>
 <div class="n">${c.id}. ${c.name}<span class="tag">${c.group}</span>${c.proxy?'<span class="tag">proxy</span>':''}</div>
 <div class="d">${c.detail}</div>${c.threshold?`<div class="d">Warns at: ${c.threshold}</div>`:''}</div></div>`).join('');
 const v=d.qqq_series.map(x=>x[1]),lo=Math.min(...v),hi=Math.max(...v);
 ch.innerHTML=`<polyline fill="none" stroke="var(--warn)" stroke-width="2" vector-effect="non-scaling-stroke" points="${v.map((y,i)=>`${i/(v.length-1)*600},${105-(y-lo)/(hi-lo)*100}`).join(' ')}"/>`;
 disc.textContent=d.disclaimer;
}).catch(e=>{sub.textContent='Could not load data/latest.json. Run the engine first.'});
</script></body></html>
